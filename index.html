<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Architect Toolkit</title>
<meta name="description" content="A working toolkit for AI-architecture consulting engagements — organized by delivery phase, starting with Discovery &amp; Assessment: AI maturity scoring and a 5C data-readiness assessment.">
<meta property="og:type" content="website">
<meta property="og:title" content="AI Architect Toolkit">
<meta property="og:description" content="A working toolkit for AI-architecture consulting engagements — organized by delivery phase, starting with Discovery & Assessment.">
<meta property="og:url" content="https://emmayg0722.github.io/AoA/">
<meta property="og:image" content="https://emmayg0722.github.io/AoA/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231B1474'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1B1474;
    --primary-dark: #120D52;
    --accent: #DCDDF6;
    --powder: #EEEEFA;
    --ink: #1c1c28;
    --muted: #5b5b6b;
    --line: #e4e4f0;
    --font-heading: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    /* Layer scale. Only two layers exist on this page; keep it that way. */
    --z-spotlight: 0;
    --z-content: 1;
    --z-skip-link: 10;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: #fafaff;
    line-height: 1.6;
  }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; border-radius: 4px; }
  .hero :focus-visible { outline-color: #fff; }
  .skip-link {
    position: absolute; left: 12px; top: -60px;
    z-index: var(--z-skip-link);
    font-size: 14px; font-weight: 600;
    color: var(--primary); background: #fff;
    padding: 10px 16px; border-radius: 8px;
    text-decoration: none;
    transition: top 0.15s ease;
  }
  .skip-link:focus { top: 12px; }
  .hero {
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
    color: #fff;
    padding: 72px 24px 64px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: "";
    position: absolute;
    top: -90px; right: -70px;
    width: 320px; height: 320px;
    background: var(--accent);
    opacity: 0.18;
    border-radius: 50%;
  }
  /* Pointer-reactive backdrop. --mx/--my are fed by a rAF-throttled
     pointermove handler; opacity is driven by :hover so leaving the hero
     fades it out with no JS involved. Paint-only, never layout. */
  .hero::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(
      460px circle at var(--mx, 78%) var(--my, 22%),
      rgba(220, 221, 246, 0.20),
      rgba(220, 221, 246, 0.06) 42%,
      transparent 68%
    );
    opacity: 0;
    transition: opacity 480ms cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }
  .hero:hover::before { opacity: 1; }
  .wrap { max-width: 960px; margin: 0 auto; position: relative; z-index: 1; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
  select#langSelect { font-family: var(--font-body); font-size: 13px; font-weight: 600; border: 1.5px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.08); color: #fff; border-radius: 8px; padding: 7px 10px; }
  select#langSelect option { color: var(--ink); }
  .eyebrow {
    display: inline-block;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 18px;
  }
  .hero h1 {
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 46px;
    line-height: 1.12;
    letter-spacing: -0.015em;
    /* 880px keeps this headline to two balanced lines at desktop; at 720px
       it broke to three. */
    max-width: 880px;
    text-wrap: balance;
  }
  .hero p {
    margin-top: 18px;
    font-size: 18px;
    color: #dcdcf2;
    max-width: 60ch;
    text-wrap: pretty;
  }
  .hero-stats {
    display: flex;
    flex-wrap: wrap;
    gap: 22px;
    margin-top: 26px;
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,0.18);
  }
  .hero-stats span {
    font-size: 14px;
    color: #dcdcf2;
  }
  /* Each stat is one unbreakable unit, so a number never separates from its
     label. Narrow screens swap to compact labels (see the 480px query) so
     all three still share a single row instead of the privacy note wrapping
     onto its own line. */
  .hero-stats > span { white-space: nowrap; }
  .hero-stats .lbl-short { display: none; }
  .hero-stats strong {
    font-family: var(--font-heading);
    font-size: 20px;
    color: #fff;
    margin-right: 6px;
  }
  main { max-width: 960px; margin: 0 auto; padding: 48px 24px 72px; }
  .phase-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 36px;
  }
  .phase-nav a {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--primary);
    background: var(--powder);
    border: 1px solid var(--line);
    padding: 7px 13px;
    border-radius: 20px;
    text-decoration: none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .phase-nav a:hover { background: var(--accent); border-color: var(--accent); }
  /* Find-a-tool filter: 32 cards is too many to scan, so offer a direct
     text path alongside browsing by phase. */
  .tool-find { margin-bottom: 14px; }
  #toolFilter {
    width: 100%;
    max-width: 420px;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--ink);
    background: #fff;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
  }
  #toolFilter::placeholder { color: var(--muted); }
  .filter-status { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 1.2em; }
  .phase-head[hidden], .phase-sub[hidden], .cards[hidden], .card[hidden] { display: none; }
  .no-results {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 26px; color: var(--muted); font-size: 15px;
  }
  .phase-count {
    font-size: 12px;
    color: var(--muted);
    font-weight: 500;
  }
  .phase-head {
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px 14px;
    margin: 8px 0 6px;
  }
  .phase-head h2 {
    font-family: var(--font-heading);
    font-weight: 600;
    font-size: 28px;
    color: var(--primary);
    text-wrap: balance;
    /* Flex items floor at min-content by default, and the Danish/Swedish phase
       titles contain compounds ("omkostningsoptimering",
       "Leverantörsutvärdering") wider than a 320px phone. min-width: 0 lets the
       heading shrink so the overflow-wrap rule below can break the word. */
    min-width: 0;
  }
  .phase-tag {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--primary);
    background: var(--accent);
    padding: 4px 10px;
    border-radius: 20px;
  }
  .phase-sub { color: var(--muted); margin-bottom: 24px; max-width: 72ch; text-wrap: pretty; }
  /* minmax(0, 1fr) instead of 1fr: a 1fr track floors at min-content, which
     for Danish and Swedish compounds ("Implementeringsstyrningsplan",
     "Kvalitetssäkringstestplan") is wider than a phone, so the grid pushed
     the whole page sideways. Paired with the wrapping rules below. */
  .cards { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
  .card h3, .card p, .phase-head h2, .hero h1 { overflow-wrap: break-word; hyphens: auto; }
  .card {
    display: flex;
    flex-direction: column;
    position: relative;
    isolation: isolate;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 26px 26px 24px;
    text-decoration: none;
    color: inherit;
    transition:
      transform 260ms cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow 260ms cubic-bezier(0.22, 1, 0.36, 1),
      border-color 260ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  /* Pointer spotlight. Sits on its own layer below the card's content
     (z-index 0 vs. 1) so it can never wash out the text, and fades via
     opacity so there is nothing to animate on the layout. --cx/--cy are
     fed by the same rAF-throttled handler that drives the hero. */
  .card::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    border-radius: inherit;
    background: radial-gradient(
      240px circle at var(--cx, 50%) var(--cy, 0%),
      rgba(220, 221, 246, 0.55),
      rgba(238, 238, 250, 0.28) 45%,
      transparent 72%
    );
    opacity: 0;
    transition: opacity 300ms cubic-bezier(0.22, 1, 0.36, 1);
    pointer-events: none;
  }
  .card > * { position: relative; z-index: 1; }
  .card:hover::before { opacity: 1; }
  .card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(27, 20, 116, 0.12);
    border-color: var(--primary);
  }
  .card .icon { font-size: 30px; margin-bottom: 14px; }
  .card h3 {
    font-family: var(--font-heading);
    font-weight: 600;
    font-size: 21px;
    color: var(--primary);
    margin-bottom: 8px;
    text-wrap: balance;
  }
  .card p { color: var(--muted); font-size: 15px; flex: 1; text-wrap: pretty; }
  .card .go {
    margin-top: 18px;
    font-weight: 600;
    font-size: 14px;
    color: var(--primary);
  }
  .dash {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 22px 24px;
    margin-bottom: 40px;
  }
  .dash-head { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .dash-head h2 { font-family: var(--font-heading); font-weight: 600; font-size: 24px; color: var(--primary); }
  .dash-report-link { font-size: 13.5px; font-weight: 600; color: var(--primary); background: var(--accent); padding: 7px 13px; border-radius: 8px; text-decoration: none; }
  .dash-report-link:hover { background: #C3C5EC; }
  .dash-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  /* Destructive, so it stays visually subordinate to the report link and is
     hidden entirely while there is nothing stored to clear. */
  .dash-reset {
    font-family: var(--font-body);
    font-size: 13.5px; font-weight: 600;
    color: var(--red); background: #fff;
    border: 1.5px solid var(--line);
    padding: 7px 13px; border-radius: 8px; cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .dash-reset:hover { background: #fbeaea; border-color: var(--red); }
  .dash.is-empty .dash-reset { display: none; }
  .dash-sub { color: var(--muted); font-size: 14px; margin: 6px 0 14px; }
  .dash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 7px 14px; }
  .dash-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink); text-decoration: none; padding: 3px 2px; border-radius: 6px; }
  .dash-item:hover { background: var(--powder); }
  .dash-item .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; box-sizing: border-box; }
  .dash-item .dot.started { background: var(--primary); }
  .dash-item .dot.empty { background: none; border: 1.5px solid var(--line); }
  /* Collapsed first-run state: no chip grid, tighter box, so the tool
     listings sit closer to the top of the page. */
  .dash.is-empty { padding: 16px 20px; }
  .dash.is-empty .dash-sub { margin-bottom: 0; }
  .dash.is-empty .dash-grid { display: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  footer {
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px 56px;
    color: var(--muted);
    font-size: 13px;
  }
  @media (max-width: 480px) {
    /* Measured with Inter actually loaded, the full three-item strip needs
       ~546-564px depending on language. Even with compact labels the Danish
       and Swedish wordings need 385px and 428px, so they still wrapped on
       most phones. The two counts are the part worth keeping at this size;
       the browser-only claim is already in the footer and on every tool
       page, so it drops out here rather than forcing a second row or type
       below the readable minimum. */
    .hero-stats { gap: 16px; }
    .hero-stats .lbl-long { display: none; }
    .hero-stats .lbl-short { display: inline; }
    .hero-stats .stat-privacy { display: none; }
  }
  @media (max-width: 720px) {
    .hero { padding: 56px 20px 48px; }
    .hero h1 { font-size: 34px; }
    .cards { grid-template-columns: minmax(0, 1fr); }
    /* The seven phase pills stacked into seven rows on a phone, which read
       as a wall rather than a navigation aid. One swipeable row instead. */
    .phase-nav {
      flex-wrap: nowrap;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x proximity;
      margin-inline: -20px;
      padding-inline: 20px;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .phase-nav::-webkit-scrollbar { display: none; }
    .phase-nav a { flex: none; white-space: nowrap; scroll-snap-align: start; }
    /* Touch targets: all of these measured 33-41px, under the 44px minimum.
       16px on the inputs also stops iOS auto-zooming the page on focus. */
    .phase-nav a, .dash-report-link {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
    }
    #toolFilter { min-height: 44px; font-size: 16px; }
    select#langSelect { min-height: 44px; font-size: 16px; }
    /* Card copy is written for desktop scanning; on a phone it made the page
       ~18 screens tall. Trim to a readable summary, full text is on the tool. */
    .card p {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  }
  /* The pointer spotlights are decorative. Under reduced motion they stop
     tracking entirely (the JS bails) and the lift/fade collapse to nothing,
     leaving the plain hover state, which still reads as interactive via the
     border colour change. */
  @media (prefers-reduced-motion: reduce) {
    .hero::before { display: none; }
    .card::before { display: none; }
    .card, .phase-nav a, .skip-link { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>

function _numOnly(s) { return /^\d+(\.\d+)?$/.test(s.trim()); }
function _hasContent(v) {
  if (typeof v === 'string') return v.trim() !== '' && !_numOnly(v);
  if (Array.isArray(v)) return v.some(_hasContent);
  if (v && typeof v === 'object') return Object.keys(v).some(k => ['lang', 'nextId', 'id', 'status'].indexOf(k) === -1 && _hasContent(v[k]));
  return false;
}
// "Started" = has content beyond the shared client/assessor/useCase prefill.
// `status` is excluded because every tracker seeds one blank row with a
// default status; counting that string would mark an untouched tool started.
function toolStarted(key) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return false;
    const o = JSON.parse(raw);
    if (o && o.picks && Object.keys(o.picks).length) return true;
    if (o && o.fields) {
      const f = Object.assign({}, o.fields);
      delete f.client; delete f.assessor; delete f.useCase;
      const rest = Object.assign({}, o, { fields: f });
      return _hasContent(rest);
    }
    const flat = Object.assign({}, o);
    delete flat.client; delete flat.assessor; delete flat.useCase;
    return _hasContent(flat);
  } catch (e) { return false; }
}

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
// Markdown table cells: a raw | or newline in a tracker value would otherwise
// invent columns or rows in the exported deliverable.
function mdCell(v) { return String(v === undefined || v === null ? '' : v).replace(/\|/g, '\\|').replace(/\r?\n/g, ' '); }

function renderDashboard() {
  let eng = {};
  try { eng = JSON.parse(localStorage.getItem('aoa_engagement_v1') || '{}'); } catch (e) {}
  const started = TOOL_REGISTRY.filter(tl => toolStarted(tl.key)).length;
  const summary = document.getElementById('dashSummary');
  const dash = document.querySelector('.dash');
  // Progressive disclosure: with no engagement yet, the 32 progress chips are
  // 32 identical empty dots and the tool listings are what a first-time
  // visitor actually needs. Collapse to a single line until there is
  // something to track.
  const isEmpty = !eng.client && started === 0;
  if (dash) dash.classList.toggle('is-empty', isEmpty);
  if (isEmpty) {
    summary.textContent = t('dashNoEngagement');
    document.getElementById('dashGrid').innerHTML = '';
    return;
  }
  {
    const parts = [];
    if (eng.client) parts.push(t('dashClientPrefix') + ' ' + eng.client + (eng.useCase ? ' — ' + eng.useCase : ''));
    parts.push(t('dashProgress')(started, TOOL_REGISTRY.length));
    summary.textContent = parts.join(' · ');
  }
  document.getElementById('dashGrid').innerHTML = TOOL_REGISTRY.map(tl => {
    const started = toolStarted(tl.key);
    const statusLabel = started ? t('dashStarted') : t('dashNotStarted');
    return `<a class="dash-item" href="${tl.href}" title="${esc(statusLabel)}"><i class="dot ${started ? 'started' : 'empty'}" aria-hidden="true"></i>${esc(t(tl.titleKey))}<span class="sr-only"> (${esc(statusLabel)})</span></a>`;
  }).join('');
}

let lang = localStorage.getItem('aoa_lang') || 'en';
function t(key) { return (STRINGS[lang] && STRINGS[lang][key] !== undefined) ? STRINGS[lang][key] : (STRINGS.en[key] !== undefined ? STRINGS.en[key] : key); }
function setLang(l) { lang = l; localStorage.setItem('aoa_lang', l); document.getElementById('langSelect').value = l; applyI18n(); renderDashboard(); }
const PHASE_NAV = [
  { id: 'phase-1', titleKey: 'p1Title', tagKey: 'tagP1' },
  { id: 'phase-2', titleKey: 'p2Title', tagKey: 'tagP2' },
  { id: 'phase-3', titleKey: 'p3Title', tagKey: 'tagP3' },
  { id: 'phase-4', titleKey: 'p4Title', tagKey: 'tagP4' },
  { id: 'phase-5', titleKey: 'p5Title', tagKey: 'tagP5' },
  { id: 'phase-6', titleKey: 'p6Title', tagKey: 'tagP6' },
  { id: 'phase-7', titleKey: 'p7Title', tagKey: 'tagP7' },
  { id: 'phase-8', titleKey: 'p8Title', tagKey: 'tagP8' },
  { id: 'phase-9', titleKey: 'p9Title', tagKey: 'tagP9' },
  { id: 'phase-10', titleKey: 'p10Title', tagKey: 'tagP10' },
];
function renderPhaseNav() {
  const nav = document.getElementById('phaseNav');
  if (!nav) return;
  nav.innerHTML = PHASE_NAV.map(p => `<a href="#${p.id}">${esc(t(p.tagKey))} · ${esc(t(p.titleKey))}</a>`).join('');
}
function renderPhaseCounts() {
  document.querySelectorAll('.phase-head').forEach(head => {
    const countEl = head.querySelector('.phase-count');
    if (!countEl) return;
    let cardsEl = head.nextElementSibling;
    while (cardsEl && !cardsEl.classList.contains('cards')) cardsEl = cardsEl.nextElementSibling;
    if (!cardsEl) return;
    const n = cardsEl.querySelectorAll('a.card').length;
    if (n) countEl.textContent = t('toolsCountLabel')(n);
  });
  const totalTools = document.querySelectorAll('main .cards a.card').length;
  const totalPhases = document.querySelectorAll('.phase-head').length;
  const statTools = document.getElementById('statToolsNum');
  const statPhases = document.getElementById('statPhasesNum');
  if (statTools) statTools.textContent = totalTools;
  if (statPhases) statPhases.textContent = totalPhases;
}

// ── Reset the engagement ──────────────────────────────────────────────
// Clears every tool's saved state in this browser plus the shared
// client / assessor / use case, then re-renders. Destructive and
// irreversible, so it confirms first and points at the export path.
function resetEngagement() {
  if (!confirm(t('dashResetConfirm'))) return;
  try {
    TOOL_REGISTRY.forEach(tl => localStorage.removeItem(tl.key));
    localStorage.removeItem('aoa_engagement_v1');
  } catch (e) {}
  renderDashboard();
  const summary = document.getElementById('dashSummary');
  if (summary) summary.textContent = t('dashResetDone');
}

// ── Find-a-tool filter ────────────────────────────────────────────────
// Filters the card grid in place and hides any phase whose cards all drop
// out, so the page never shows a heading above an empty grid.
function filterTools(q) {
  const query = String(q || '').trim().toLowerCase();
  const heads = Array.from(document.querySelectorAll('main .phase-head'));
  let shown = 0, total = 0;

  heads.forEach(head => {
    let sub = head.nextElementSibling;
    while (sub && !sub.classList.contains('phase-sub')) sub = sub.nextElementSibling;
    let grid = head.nextElementSibling;
    while (grid && !grid.classList.contains('cards')) grid = grid.nextElementSibling;
    if (!grid) return;

    let visibleHere = 0;
    grid.querySelectorAll('a.card').forEach(card => {
      total++;
      const hay = card.textContent.toLowerCase();
      const match = !query || hay.indexOf(query) !== -1;
      card.hidden = !match;
      if (match) { visibleHere++; shown++; }
    });
    head.hidden = visibleHere === 0;
    if (sub) sub.hidden = visibleHere === 0;
    grid.hidden = visibleHere === 0;
  });

  const status = document.getElementById('filterStatus');
  if (status) status.textContent = query ? (shown === 0 ? t('filterNone') : t('filterCount')(shown, total)) : '';
  // A search that matches nothing should not leave the page looking broken.
  let none = document.getElementById('noResults');
  if (query && shown === 0) {
    if (!none) {
      none = document.createElement('p');
      none.id = 'noResults';
      none.className = 'no-results';
      document.querySelector('main .phase-head').parentNode.insertBefore(none, document.querySelector('main .phase-head'));
    }
    none.textContent = t('filterNone');
    none.hidden = false;
  } else if (none) {
    none.hidden = true;
  }
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
  document.documentElement.lang = lang;
  const f = document.getElementById('toolFilter');
  if (f) f.placeholder = t('filterPlaceholder');
  renderPhaseNav();
  renderPhaseCounts();
  if (f && f.value) filterTools(f.value);
}

// ── Pointer-reactive spotlights (hero backdrop + tool cards) ──────────
// Feeds --mx/--my and --cx/--cy as percentages; CSS owns all fading via
// :hover, so this only ever writes two custom properties. Writes are
// batched into one animation frame and touch no layout property, so there
// is nothing here that can cause a reflow. Skipped entirely on coarse
// pointers (touch) and under prefers-reduced-motion.
(function pointerSpotlights() {
  const fine = window.matchMedia('(hover: hover) and (pointer: fine)');
  const calm = window.matchMedia('(prefers-reduced-motion: reduce)');
  if (!fine.matches || calm.matches) return;

  const queue = new Map();
  let frame = 0;
  function flush() {
    frame = 0;
    queue.forEach((pos, el) => {
      el.style.setProperty(pos.px, pos.x + '%');
      el.style.setProperty(pos.py, pos.y + '%');
    });
    queue.clear();
  }
  function track(el, e, px, py) {
    const r = el.getBoundingClientRect();
    if (!r.width || !r.height) return;
    queue.set(el, {
      px: px, py: py,
      x: (((e.clientX - r.left) / r.width) * 100).toFixed(1),
      y: (((e.clientY - r.top) / r.height) * 100).toFixed(1),
    });
    if (!frame) frame = requestAnimationFrame(flush);
  }

  const hero = document.querySelector('.hero');
  if (hero) {
    hero.addEventListener('pointermove', e => track(hero, e, '--mx', '--my'), { passive: true });
  }
  const main = document.querySelector('main');
  if (main) {
    main.addEventListener('pointermove', e => {
      const card = e.target.closest && e.target.closest('a.card');
      if (card) track(card, e, '--cx', '--cy');
    }, { passive: true });
  }
})();

(function init() {
  document.getElementById('langSelect').value = lang;
  applyI18n();
  renderDashboard();
})();
</script>
