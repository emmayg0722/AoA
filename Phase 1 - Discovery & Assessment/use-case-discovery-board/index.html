<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Use Case Discovery Board — Phase 1</title>
<meta name="description" content="A workshop canvas for mapping a client's as-is workflow, marking friction, and attaching candidate AI use cases to the steps they would change.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231B1474'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #1B1474; --primary-dark: #120D52; --accent: #DCDDF6; --powder: #EEEEFA;
    --ink: #1c1c28; --muted: #5b5b6b; --line: #e4e4f0;
    --green: #1a8a5c; --amber: #d4790e; --red: #c0392b;
    --font-heading: 'Fraunces', Georgia, serif;
    --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    /* One pair per block type: the board reads as a legend without one. */
    --step-bg: #ffffff;  --step-bd: #1B1474;
    --pain-bg: #fff3f0;  --pain-bd: #c0392b;
    --sys-bg:  #f1f4fb;  --sys-bd:  #4a5c8a;
    --uc-bg:   #EEEEFA;  --uc-bd:   #5348c4;
    --note-bg: #fffbe8;  --note-bd: #d4790e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-body); color: var(--ink); background: #fafaff; line-height: 1.6; }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; border-radius: 4px; }
  .hero :focus-visible, .header :focus-visible { outline-color: #fff; }
  .hero { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #fff; padding: 44px 24px 36px; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .crumb { font-size: 13px; color: var(--accent); margin-bottom: 10px; }
  .crumb a { color: var(--accent); text-decoration: none; }
  .crumb .next-nav a { font-weight: 700; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 20px; flex-wrap: wrap; }
  .hero h1 { font-family: var(--font-heading); font-weight: 700; font-size: 34px; line-height: 1.15; }
  .hero p { margin-top: 10px; font-size: 15.5px; color: #dcdcf2; max-width: 680px; }
  select#langSelect { font-family: var(--font-body); font-size: 13px; font-weight: 600; border: 1.5px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.08); color: #fff; border-radius: 8px; padding: 7px 10px; }
  select#langSelect option { color: var(--ink); }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 80px; }
  .note { background: var(--powder); border: 1px solid var(--accent); border-radius: 12px; padding: 14px 16px; font-size: 14px; color: var(--muted); margin-bottom: 26px; }
  .note strong { color: var(--primary); }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 22px 24px; margin-bottom: 20px; }
  .card > h2 { font-family: var(--font-heading); font-weight: 600; font-size: 21px; color: var(--primary); margin-bottom: 4px; }
  .card .hint { font-size: 13.5px; color: var(--muted); margin-bottom: 14px; }
  ol.sop { margin-left: 20px; }
  ol.sop li { margin-bottom: 10px; font-size: 14px; }
  ol.sop li.done > label.sop-step > span { text-decoration: line-through; color: var(--muted); }
  label.sop-step { display: flex; gap: 9px; align-items: flex-start; font-weight: 400; margin: 0; cursor: pointer; font-size: 14px; color: var(--ink); }
  label.sop-step input { width: auto; margin-top: 4px; flex: none; }
  label.sop-step > span { min-width: 0; overflow-wrap: break-word; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--ink); margin: 10px 0 5px; }
  input[type=text], select.field, textarea { width: 100%; font-family: var(--font-body); font-size: 14px; color: var(--ink); border: 1.5px solid var(--line); border-radius: 8px; padding: 9px 11px; background: #fff; }
  textarea { resize: vertical; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(27,20,116,0.12); }
  input:focus:not(:focus-visible), select:focus:not(:focus-visible), textarea:focus:not(:focus-visible) { outline: none; }
  .grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 16px; }
  .btn { font-family: var(--font-body); font-size: 13.5px; font-weight: 600; padding: 9px 16px; border-radius: 8px; border: none; cursor: pointer; transition: all 0.15s; }
  .btn-primary { background: var(--accent); color: var(--primary); }
  .btn-primary:hover { background: #C3C5EC; }
  .btn-secondary { background: #fff; color: var(--primary); border: 1.5px solid var(--accent); }
  .btn-secondary:hover { background: var(--powder); }
  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
  .preview { border: 1px dashed var(--line); border-radius: 10px; padding: 18px 20px; background: #fcfcff; font-size: 14px; }
  .preview h3 { font-family: var(--font-heading); color: var(--primary); font-size: 16px; margin: 14px 0 6px; }
  .preview h3:first-child { margin-top: 0; }
  .preview h2 { font-family: var(--font-heading); color: var(--primary); font-size: 18px; margin: 16px 0 6px; }
  .preview h4, .preview h5 { font-family: var(--font-heading); color: var(--primary); margin: 12px 0 4px; }
  .preview ul, .preview ol { margin: 8px 0 8px 22px; }
  .preview li { margin-bottom: 4px; }
  .preview code { background: #ececf6; padding: 1px 5px; border-radius: 4px; font-size: 12.5px; }
  .preview pre { background: #f5f5fc; border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; margin: 10px 0; }
  .preview table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 8px 0; }
  .preview th, .preview td { border: 1px solid var(--line); padding: 6px 9px; text-align: left; vertical-align: top; }
  .preview th { background: var(--powder); color: var(--primary); }
  .prompt-box { display: none; margin-top: 12px; }
  pre.prompt { background: #f5f5fc; border: 1px solid var(--line); border-radius: 10px; padding: 14px; font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; color: #2a2a3a; max-height: 320px; overflow: auto; }
  textarea[data-eng="draftDoc"] { min-height: 110px; }
  .saved { font-size: 12.5px; color: var(--green); margin-left: 8px; }
  /* Sizes to its longest option by default, and the example labels are
     longer than a phone is wide. min-width:0 lets it shrink inside the
     flex row rather than pushing the page sideways. */
  #sampleSelect { width: auto; max-width: 100%; min-width: 0; }
  .preview, .report { overflow-x: auto; }
  h1, h2, h3, h4, p, label, dt, dd, th, td, span, .hint, .crumb { overflow-wrap: break-word; hyphens: auto; }

  /* ── The board ──────────────────────────────────────────────────
     .board-shell is the frame; .board-view is the clipping window the
     pan/zoom happens inside; .board-world is the transformed plane the
     edge SVG and every block live on. Focus mode promotes the shell to
     a fixed full-viewport panel for projecting in a workshop room. */
  .board-shell { border: 1px solid var(--line); border-radius: 12px; background: #fff; overflow: hidden; display: flex; flex-direction: column; }
  .board-shell.focus { position: fixed; inset: 0; z-index: 60; border-radius: 0; }
  .board-shell:fullscreen { background: #fff; border-radius: 0; }
  body.focus-on { overflow: hidden; }
  .board-toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 9px 10px; border-bottom: 1px solid var(--line); background: #fcfcff; }
  .board-toolbar .sep { width: 1px; align-self: stretch; background: var(--line); margin: 0 4px; }
  .tbtn { font-family: var(--font-body); font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 7px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; white-space: nowrap; }
  .tbtn:hover { background: var(--powder); border-color: var(--accent); }
  .tbtn[disabled] { opacity: 0.4; cursor: default; }
  .tbtn .swatch { display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1.5px solid; }
  .tbtn.add-step  .swatch { background: var(--step-bg); border-color: var(--step-bd); }
  .tbtn.add-pain  .swatch { background: var(--pain-bg); border-color: var(--pain-bd); }
  .tbtn.add-sys   .swatch { background: var(--sys-bg);  border-color: var(--sys-bd); }
  .tbtn.add-uc    .swatch { background: var(--uc-bg);   border-color: var(--uc-bd); }
  .tbtn.add-note  .swatch { background: var(--note-bg); border-color: var(--note-bd); }
  .board-view { position: relative; height: 560px; overflow: hidden; background: #fbfbff;
    background-image: radial-gradient(#e2e2f2 1px, transparent 1px); background-size: 22px 22px; touch-action: none; cursor: grab; flex: 1 1 auto; }
  .board-shell.focus .board-view { height: auto; }
  .board-view.panning { cursor: grabbing; }
  .board-view.linking { cursor: crosshair; }
  .board-world { position: absolute; top: 0; left: 0; width: 4000px; height: 3000px; transform-origin: 0 0; }
  .board-edges { position: absolute; top: 0; left: 0; width: 4000px; height: 3000px; overflow: visible; }
  .edge-hit { stroke: transparent; stroke-width: 14; fill: none; cursor: pointer; }
  .edge-line { fill: none; stroke: var(--primary); stroke-width: 2; }
  .edge-line.soft { stroke: var(--uc-bd); stroke-dasharray: 6 5; }
  .edge-line.sel { stroke: var(--green); stroke-width: 3.5; }
  .edge-label { font: 600 11px var(--font-body); fill: var(--muted); paint-order: stroke; stroke: #fbfbff; stroke-width: 4px; }
  .node { position: absolute; border-radius: 10px; border: 2px solid; padding: 9px 11px 10px; font-size: 13px;
    box-shadow: 0 1px 3px rgba(27,20,116,0.08); cursor: grab; user-select: none; touch-action: none; }
  .node:active { cursor: grabbing; }
  .node.sel { box-shadow: 0 0 0 3px rgba(26,138,92,0.35), 0 2px 8px rgba(27,20,116,0.14); }
  .node.link-target { box-shadow: 0 0 0 3px rgba(212,121,14,0.45); }
  .node .node-type { display: block; font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.72; margin-bottom: 2px; }
  .node .node-title { font-weight: 700; font-size: 13.5px; line-height: 1.3; overflow-wrap: break-word; }
  .node .node-detail { margin-top: 3px; color: var(--muted); font-size: 12px; line-height: 1.4; overflow-wrap: break-word; }
  .node .node-meta { margin-top: 5px; font-size: 11px; font-weight: 600; opacity: 0.8; overflow-wrap: break-word; }
  .node.t-step { background: var(--step-bg); border-color: var(--step-bd); color: var(--primary); }
  .node.t-pain { background: var(--pain-bg); border-color: var(--pain-bd); color: var(--red); }
  .node.t-system { background: var(--sys-bg); border-color: var(--sys-bd); color: var(--sys-bd); }
  .node.t-usecase { background: var(--uc-bg); border-color: var(--uc-bd); color: var(--uc-bd); }
  .node.t-note { background: var(--note-bg); border-color: var(--note-bd); color: var(--amber); }
  .node .node-title, .node .node-detail { color: var(--ink); }
  /* The dot counter-scales against the board zoom so it stays the same
     size on screen however far out you are, and ::after gives it a grab
     area far larger than it looks — at 0.7 zoom the old 16px dot rendered
     at 11px and was easy to miss entirely. */
  .node-handle { position: absolute; right: -9px; top: 50%; margin-top: -9px; width: 18px; height: 18px; border-radius: 50%;
    background: #fff; border: 2.5px solid var(--primary); cursor: crosshair;
    transform: scale(calc(1 / var(--z, 1))); transform-origin: center;
    transition: background 0.12s, box-shadow 0.12s; }
  .node-handle::after { content: ''; position: absolute; inset: -11px; border-radius: 50%; }
  .node:hover .node-handle { background: var(--accent); box-shadow: 0 0 0 3px rgba(27,20,116,0.16); }
  .node-handle:hover { background: var(--primary); box-shadow: 0 0 0 4px rgba(27,20,116,0.22); }
  .board-empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    color: var(--muted); font-size: 14px; padding: 24px; pointer-events: none; }
  .board-status { position: absolute; left: 12px; bottom: 12px; background: rgba(27,20,116,0.92); color: #fff; font-size: 12.5px;
    font-weight: 600; padding: 6px 12px; border-radius: 8px; pointer-events: none; }
  /* The inspector rides inside the board so it stays reachable in focus
     mode, where there is no page around the canvas to put it beside. */
  .inspector { position: absolute; top: 10px; right: 10px; width: 250px; max-height: calc(100% - 20px); overflow-y: auto;
    background: #fff; border: 1px solid var(--line); border-radius: 11px; padding: 12px 13px; box-shadow: 0 4px 16px rgba(27,20,116,0.12); }
  /* Hidden unless something is selected, so it is not sitting on top of
     the canvas during the part of the workshop that is pure drawing; and
     click-through while a connection is being drawn, so a block underneath
     it can still be picked as the target. */
  .inspector.is-hidden { display: none; }
  .inspector.dim { pointer-events: none; opacity: 0.35; }
  .inspector h4 { font-family: var(--font-heading); font-size: 14px; color: var(--primary); margin-bottom: 2px; }
  .inspector label { font-size: 11.5px; margin: 8px 0 3px; }
  .inspector input[type=text], .inspector select, .inspector textarea { font-size: 12.5px; padding: 6px 8px; }
  .inspector textarea { min-height: 52px; }
  .inspector .btn-row { margin-top: 10px; gap: 6px; }
  .inspector .btn { font-size: 12px; padding: 6px 10px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
  .legend span.k { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 1.5px solid; margin-right: 5px; vertical-align: -1px; }
  .k.step { background: var(--step-bg); border-color: var(--step-bd); }
  .k.pain { background: var(--pain-bg); border-color: var(--pain-bd); }
  .k.system { background: var(--sys-bg); border-color: var(--sys-bd); }
  .k.usecase { background: var(--uc-bg); border-color: var(--uc-bd); }
  .k.note { background: var(--note-bg); border-color: var(--note-bd); }
  /* Only shown to someone who arrived on a relay's shared link, so joining
     does not mean scrolling past the whole board to find the panel below it. */
  .live-invite { display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    background: var(--powder); border: 1.5px solid var(--accent); border-radius: 12px;
    padding: 12px 16px; margin-bottom: 18px; }
  .live-invite .li-text { font-size: 14px; font-weight: 600; color: var(--primary); }
  .live-invite input { width: auto; flex: 1 1 180px; min-width: 0; padding: 7px 10px; font-size: 13.5px; }
  .peers { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .peer { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600;
    border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 11px 4px 8px; background: #fff; }
  .peer .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .peer.me { border-color: var(--accent); background: var(--powder); }
  .peer-strip { display: inline-flex; gap: 4px; align-items: center; margin-left: auto; padding-left: 8px; }
  .peer-strip .pip { width: 15px; height: 15px; border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 0 0 1px var(--line); }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  @media (max-width: 720px) {
    .grid2 { grid-template-columns: minmax(0, 1fr); }
    .hero h1 { font-size: 27px; }
    .board-view { height: 420px; }
    .inspector { position: static; width: auto; max-height: none; margin: 10px; box-shadow: none; }
  }
</style>
</head>
<body>
  <header class="hero"><div class="wrap">
    <div class="hero-top">
      <div class="crumb"><a href="../../">AI Architect Toolkit</a> · Phase 1 · Discovery &amp; Assessment · <span class="next-nav">Next: <a href="../use-case-prioritization/">Use Case Prioritization →</a></span></div>
      <select id="langSelect" onchange="setLang(this.value)">
        <option value="en">English</option>
        <option value="da">Dansk</option>
        <option value="sv">Svenska</option>
      </select>
    </div>
    <h1 data-i18n="heroTitle"></h1>
    <p data-i18n="heroDesc"></p>
  </div></header>

  <main>
    <div class="live-invite" id="liveInvite" hidden>
      <span class="li-text" data-i18n="inviteText"></span>
      <input type="text" id="inviteName" data-ph="phYourName">
      <button class="btn btn-primary" onclick="joinFromInvite()" data-i18n="btnGoLive"></button>
    </div>

    <div class="note"><strong data-i18n="noteLabel"></strong> <span data-i18n="noteBody"></span></div>

    <div class="card">
      <h2 data-i18n="sopTitle"></h2>
      <p class="hint" data-i18n="sopHint"></p>
      <ol class="sop" id="sopList"></ol>
      <p class="hint" id="sopProgress" style="margin:8px 0 0"></p>
    </div>

    <div class="card">
      <h2 data-i18n="clientTitle"></h2>
      <div class="grid2">
        <div><label data-i18n="lblClient"></label><input type="text" data-eng="client" placeholder="Acme Corp"></div>
        <div><label data-i18n="lblAssessor"></label><input type="text" data-eng="assessor"></div>
      </div>
      <label data-i18n="lblProcess"></label>
      <input type="text" data-eng="process" data-ph="phProcess">
      <label data-i18n="lblScope"></label>
      <input type="text" data-eng="scope" data-ph="phScope">
    </div>

    <div class="card">
      <h2 data-i18n="boardTitle"></h2>
      <p class="hint" data-i18n="boardHint"></p>

      <div class="board-shell" id="boardShell">
        <div class="board-toolbar">
          <button type="button" class="tbtn add-step"   onclick="addNode('step')"><span class="swatch"></span><span data-i18n="ntStep"></span></button>
          <button type="button" class="tbtn add-pain"   onclick="addNode('pain')"><span class="swatch"></span><span data-i18n="ntPain"></span></button>
          <button type="button" class="tbtn add-sys"    onclick="addNode('system')"><span class="swatch"></span><span data-i18n="ntSystem"></span></button>
          <button type="button" class="tbtn add-uc"     onclick="addNode('usecase')"><span class="swatch"></span><span data-i18n="ntUsecase"></span></button>
          <button type="button" class="tbtn add-note"   onclick="addNode('note')"><span class="swatch"></span><span data-i18n="ntNote"></span></button>
          <span class="sep"></span>
          <button type="button" class="tbtn" id="btnUndo" onclick="undo()" data-i18n="btnUndo"></button>
          <button type="button" class="tbtn" id="btnRedo" onclick="redo()" data-i18n="btnRedo"></button>
          <span class="sep"></span>
          <button type="button" class="tbtn" onclick="zoomStep(1.2)" aria-label="Zoom in">+</button>
          <button type="button" class="tbtn" onclick="zoomStep(1/1.2)" aria-label="Zoom out">−</button>
          <button type="button" class="tbtn" onclick="fitBoard()" data-i18n="btnFit"></button>
          <button type="button" class="tbtn" id="btnFocus" onclick="toggleFocus()" data-i18n="btnFocus"></button>
          <span class="sep"></span>
          <button type="button" class="tbtn" onclick="clearBoard()" data-i18n="btnClearBoard"></button>
          <span class="peer-strip" id="peerStrip"></span>
        </div>
        <div class="board-view" id="boardView">
          <div class="board-world" id="boardWorld">
            <svg class="board-edges" id="boardEdges" aria-hidden="true">
              <defs>
                <marker id="arrowHead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
                  <path d="M0,0 L10,5 L0,10 z" fill="#1B1474"></path>
                </marker>
                <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse">
                  <path d="M0,0 L10,5 L0,10 z" fill="#5348c4"></path>
                </marker>
              </defs>
              <g id="edgeLayer"></g>
            </svg>
            <div id="nodeLayer"></div>
          </div>
          <div class="board-empty" id="boardEmpty" data-i18n="boardEmpty"></div>
          <div class="board-status" id="boardStatus" style="display:none"></div>
          <div class="inspector" id="inspector"></div>
        </div>
      </div>

      <div class="legend">
        <span><span class="k step"></span><span data-i18n="ntStep"></span></span>
        <span><span class="k pain"></span><span data-i18n="ntPain"></span></span>
        <span><span class="k system"></span><span data-i18n="ntSystem"></span></span>
        <span><span class="k usecase"></span><span data-i18n="ntUsecase"></span></span>
        <span><span class="k note"></span><span data-i18n="ntNote"></span></span>
      </div>
      <p class="hint" style="margin-top:10px" data-i18n="boardKeys"></p>
      <div class="sr-only" aria-live="polite" id="srStatus"></div>
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="exportBoardSvg()" data-i18n="btnExportSvg"></button>
      </div>
    </div>

    <div class="card">
      <h2 data-i18n="syncTitle"></h2>
      <p class="hint" data-i18n="syncHint"></p>
      <div class="grid2">
        <div><label data-i18n="lblYourName"></label><input type="text" id="syncName" data-ph="phYourName"></div>
        <div><label data-i18n="lblSessionName"></label><input type="text" id="syncSession" data-ph="phSessionName"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="syncBtn" onclick="toggleSync()" data-i18n="btnGoLive"></button>
      </div>
      <div class="import-status" id="syncStatus"></div>
      <div class="peers" id="syncPeers"></div>

let lang = localStorage.getItem('aoa_lang') || 'en';

// Markdown table cells: a raw | or newline in a block label would otherwise
// invent columns or rows in the exported deliverable.

// ── Board state ─────────────────────────────────────────────────
// nodes carry meaning, layout carries geometry. Keeping them apart is
// what lets the master engagement report render `nodes` as a readable
// table instead of a column of pixel coordinates.
const TYPES = ['step', 'pain', 'system', 'usecase', 'note'];
const PATTERNS = ['', 'extract', 'classify', 'draft', 'retrieve', 'forecast', 'agent', 'recommend'];
const NODE_W = { step: 200, pain: 180, system: 180, usecase: 210, note: 190 };

let nodes = [];   // { id, type, title, detail, role, volume, pattern, value, effort }
let layout = {};  // id -> { x, y, w }
let edges = [];   // { id, from, to, label }
let nextId = 1;
let view = { x: 40, y: 40, z: 1 };
let sel = null;       // { kind: 'node'|'edge', id }
let linkFrom = null;  // node id while a connection is being drawn
let undoStack = [], redoStack = [];

const viewEl = () => document.getElementById('boardView');
const worldEl = () => document.getElementById('boardWorld');

function nodeById(id) { return nodes.find(n => n.id === id) || null; }
function edgeById(id) { return edges.find(e => e.id === id) || null; }
function typeLabel(type) { return t('nt' + type.charAt(0).toUpperCase() + type.slice(1)); }
function patternLabel(p) { return t('pat_' + (p || 'none')); }

// ── Intake fields ───────────────────────────────────────────────
function fieldEls() { return Array.from(document.querySelectorAll('[data-eng]')); }
function collectFields() { const o = {}; fieldEls().forEach(el => { o[el.getAttribute('data-eng')] = el.value; }); return o; }
function restoreFields(o) { fieldEls().forEach(el => { const k = el.getAttribute('data-eng'); if (o[k] !== undefined) el.value = o[k]; }); }
function val(k) { const el = document.querySelector(`[data-eng="${k}"]`); return el ? el.value : ''; }

// ── Persistence ─────────────────────────────────────────────────
let sopDone = [];
let savedTimer;
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify({ fields: collectFields(), nodes, layout, edges, nextId, view, sopDone, lang }));
    flashSaved();
  } catch (e) {}
}
function flashSaved() {
  const f = document.getElementById('savedFlag');
  f.textContent = '✓'; clearTimeout(savedTimer);
  savedTimer = setTimeout(() => { f.textContent = ''; }, 1200);
}
function loadSaved() {
  try {
    const o = JSON.parse(localStorage.getItem(KEY) || '{}');
    if (o.fields) restoreFields(o.fields);
    if (Array.isArray(o.nodes)) nodes = o.nodes;
    if (o.layout && typeof o.layout === 'object') layout = o.layout;
    if (Array.isArray(o.edges)) edges = o.edges;
    if (o.nextId) nextId = o.nextId;
    if (o.view && typeof o.view === 'object') view = Object.assign({ x: 40, y: 40, z: 1 }, o.view);
    if (Array.isArray(o.sopDone)) sopDone = o.sopDone;

// ── Undo / redo ─────────────────────────────────────────────────
// Snapshots are cheap here (a board is tens of blocks, not thousands),
// and a mis-drag in a live workshop is the one thing that must never
// cost the room its work.
function snapshot() { return JSON.stringify({ nodes, layout, edges, nextId }); }
function pushUndo() {
  undoStack.push(snapshot());
  if (undoStack.length > 60) undoStack.shift();
  redoStack = [];
  syncUndoButtons();
}
function applySnapshot(s) {
  const o = JSON.parse(s);
  nodes = o.nodes; layout = o.layout; edges = o.edges; nextId = o.nextId;
  sel = null; linkFrom = null;
  renderBoard(); renderPreview(); save();
  syncDoc();
}
function undo() {
  if (!undoStack.length) return;
  redoStack.push(snapshot());
  applySnapshot(undoStack.pop());
  syncUndoButtons();
}
function redo() {
  if (!redoStack.length) return;
  undoStack.push(snapshot());
  applySnapshot(redoStack.pop());
  syncUndoButtons();
}
function syncUndoButtons() {
  const u = document.getElementById('btnUndo'), r = document.getElementById('btnRedo');
  if (u) u.disabled = !undoStack.length;
  if (r) r.disabled = !redoStack.length;
}

// ── Adding blocks ───────────────────────────────────────────────
// A block added while another is selected links to it and lands beside
// it. Steps chain to the right, everything else hangs below — which is
// how a facilitator draws a flow without touching the connect handle.
function addNode(type) {
  pushUndo();
  const anchorNode = sel && sel.kind === 'node' ? nodeById(sel.id) : null;
  const w = NODE_W[type] || 190;
  let x, y;
  if (anchorNode && layout[anchorNode.id]) {
    const a = layout[anchorNode.id];
    const ah = measuredHeight(anchorNode.id);
    if (type === 'step' && anchorNode.type === 'step') { x = a.x + a.w + 70; y = a.y; }
    else { x = a.x + (a.w - w) / 2 + siblingOffset(anchorNode.id); y = a.y + ah + 70; }
  } else {
    const c = viewCenterWorld();
    x = c.x - w / 2 + (nodes.length % 5) * 18;
    y = c.y - 40 + (nodes.length % 5) * 14;
  }
  const node = { id: nextId++, type, title: t('new' + type.charAt(0).toUpperCase() + type.slice(1)), detail: '', role: '', volume: '', pattern: '', value: '3', effort: '3' };
  nodes.push(node);
  layout[node.id] = { x: Math.round(x), y: Math.round(y), w };
  let newEdge = null;
  if (anchorNode) { newEdge = { id: nextId++, from: anchorNode.id, to: node.id, label: '' }; edges.push(newEdge); }
  sel = { kind: 'node', id: node.id };
  renderBoard(); renderPreview(); save();
  syncNode(node.id);
  if (newEdge) syncEdgeOp(newEdge.id);
  const tf = document.getElementById('insTitle');
  if (tf) { tf.focus(); tf.select(); }
}
// Fan blocks that hang off the same step sideways instead of stacking
// them on top of each other.
function siblingOffset(anchorId) {
  const n = edges.filter(e => e.from === anchorId).length;
  return (n % 2 === 0 ? 1 : -1) * Math.ceil(n / 2) * 210;
}
function viewCenterWorld() {
  const r = viewEl().getBoundingClientRect();
  return { x: (r.width / 2 - view.x) / view.z, y: (r.height / 2 - view.y) / view.z };
}

function deleteSelection() {
  if (!sel) return;
  pushUndo();
  if (sel.kind === 'node') {
    nodes = nodes.filter(n => n.id !== sel.id);
    delete layout[sel.id];
    edges = edges.filter(e => e.from !== sel.id && e.to !== sel.id);
    syncNodeDel(sel.id);
  } else {
    edges = edges.filter(e => e.id !== sel.id);
    syncEdgeDel(sel.id);
  }
  sel = null;
  renderBoard(); renderPreview(); save();
}
function clearBoard() {
  if (!nodes.length && !edges.length) return;
  if (!confirm(t('clearConfirm'))) return;
  pushUndo();
  nodes = []; layout = {}; edges = []; sel = null; linkFrom = null;
  renderBoard(); renderPreview(); save();
  syncDoc();
}

// ── Rendering: blocks ───────────────────────────────────────────
const nodeEls = {};
function measuredHeight(id) { const el = nodeEls[id]; return el ? el.offsetHeight : 80; }
function nodeRect(id) {
  const p = layout[id];
  if (!p) return null;
  return { x: p.x, y: p.y, w: p.w, h: measuredHeight(id) };
}

function renderBoard(opts) {
  const layer = document.getElementById('nodeLayer');
  Object.keys(nodeEls).forEach(k => delete nodeEls[k]);
  layer.innerHTML = nodes.map(n => {
    const p = layout[n.id] || { x: 40, y: 40, w: NODE_W[n.type] || 190 };
    const meta = nodeMetaLine(n);
    return `<div class="node t-${esc(n.type)}${sel && sel.kind === 'node' && sel.id === n.id ? ' sel' : ''}${linkFrom === n.id ? ' link-target' : ''}"
        data-id="${n.id}" tabindex="0" role="button"
        aria-label="${esc(typeLabel(n.type))}: ${esc(n.title)}"
        style="left:${p.x}px;top:${p.y}px;width:${p.w}px">
      <span class="node-type">${esc(typeLabel(n.type))}</span>
      <div class="node-title">${esc(n.title)}</div>
      ${n.detail ? `<div class="node-detail">${esc(n.detail)}</div>` : ''}
      ${meta ? `<div class="node-meta">${esc(meta)}</div>` : ''}
      <span class="node-handle" data-handle="${n.id}" title="${esc(t('handleTip'))}"></span>
    </div>`;
  }).join('');
  layer.querySelectorAll('.node').forEach(el => { nodeEls[Number(el.getAttribute('data-id'))] = el; });
  applyView();
  renderEdges();
  if (!(opts && opts.keepInspector)) renderInspector();
  document.getElementById('boardEmpty').style.display = nodes.length ? 'none' : 'flex';
  syncUndoButtons();
}
function nodeMetaLine(n) {
  if (n.type === 'step') return [n.role, n.volume].filter(Boolean).join(' · ');
  if (n.type === 'usecase') {
    const bits = [];
    if (n.pattern) bits.push(patternLabel(n.pattern));
    bits.push(`${t('colValue')} ${n.value || '3'} · ${t('colEffort')} ${n.effort || '3'}`);
    return bits.join(' · ');
  }
  return '';
}

// ── Rendering: connections ──────────────────────────────────────
// The line style is derived from the endpoints rather than stored, so
// a connection cannot claim to be a flow arrow between a pain point
// and a use case.
function isFlowEdge(e) {
  const a = nodeById(e.from), b = nodeById(e.to);
  return !!(a && b && a.type === 'step' && b.type === 'step');
}
function borderPoint(r, tx, ty) {
  const cx = r.x + r.w / 2, cy = r.y + r.h / 2;
  const dx = tx - cx, dy = ty - cy;
  if (!dx && !dy) return { x: cx, y: cy };
  const sx = dx === 0 ? Infinity : (r.w / 2) / Math.abs(dx);
  const sy = dy === 0 ? Infinity : (r.h / 2) / Math.abs(dy);
  const s = Math.min(sx, sy);
  return { x: cx + dx * s, y: cy + dy * s };
}
function edgePath(e) {
  const ra = nodeRect(e.from), rb = nodeRect(e.to);
  if (!ra || !rb) return null;
  const ca = { x: ra.x + ra.w / 2, y: ra.y + ra.h / 2 };
  const cb = { x: rb.x + rb.w / 2, y: rb.y + rb.h / 2 };
  const p1 = borderPoint(ra, cb.x, cb.y);
  const p2 = borderPoint(rb, ca.x, ca.y);
  const dx = p2.x - p1.x, dy = p2.y - p1.y;
  const horiz = Math.abs(dx) >= Math.abs(dy);
  const k = Math.min(90, Math.max(28, (horiz ? Math.abs(dx) : Math.abs(dy)) * 0.45));
  const c1 = horiz ? { x: p1.x + Math.sign(dx || 1) * k, y: p1.y } : { x: p1.x, y: p1.y + Math.sign(dy || 1) * k };
  const c2 = horiz ? { x: p2.x - Math.sign(dx || 1) * k, y: p2.y } : { x: p2.x, y: p2.y - Math.sign(dy || 1) * k };
  return { d: `M${p1.x},${p1.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${p2.x},${p2.y}`, mid: { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 } };
}
function renderEdges() {
  const layer = document.getElementById('edgeLayer');
  let h = '';
  edges.forEach(e => {
    const g = edgePath(e);
    if (!g) return;
    const flow = isFlowEdge(e);
    const selected = sel && sel.kind === 'edge' && sel.id === e.id;
    h += `<path class="edge-hit" data-edge="${e.id}" d="${g.d}"></path>`;
    h += `<path class="edge-line${flow ? '' : ' soft'}${selected ? ' sel' : ''}" d="${g.d}" marker-end="url(#${flow ? 'arrowHead' : 'arrowSoft'})"></path>`;
    if (e.label) h += `<text class="edge-label" x="${g.mid.x}" y="${g.mid.y - 6}" text-anchor="middle">${esc(e.label)}</text>`;
  });
  layer.innerHTML = h;
}

// ── Rendering: inspector ────────────────────────────────────────
function renderInspector() {
  const box = document.getElementById('inspector');
  box.classList.toggle('dim', linkFrom !== null);
  if (!sel) { box.classList.add('is-hidden'); box.innerHTML = ''; return; }
  box.classList.remove('is-hidden');
  if (sel.kind === 'edge') {
    const e = edgeById(sel.id);
    if (!e) { sel = null; return renderInspector(); }
    box.innerHTML = `<h4>${esc(t('insEdge'))}</h4>
      <label>${esc(t('lblEdgeLabel'))}</label>
      <input type="text" id="insEdgeLabel" value="${esc(e.label)}" oninput="updateEdge(${e.id}, this.value)">
      <div class="btn-row"><button class="btn btn-secondary" onclick="deleteSelection()">${esc(t('btnDelete'))}</button></div>`;
    return;
  }
  const n = nodeById(sel.id);
  if (!n) { sel = null; return renderInspector(); }
  let h = `<h4>${esc(typeLabel(n.type))}</h4>
    <label>${esc(t('lblNodeTitle'))}</label>
    <input type="text" id="insTitle" value="${esc(n.title)}" oninput="updateNode(${n.id},'title',this.value)">
    <label>${esc(t('lblNodeDetail'))}</label>
    <textarea id="insDetail" placeholder="${esc(t('phDetail'))}" oninput="updateNode(${n.id},'detail',this.value)">${esc(n.detail)}</textarea>`;
  if (n.type === 'step') {
    h += `<label>${esc(t('lblRole'))}</label>
      <input type="text" placeholder="${esc(t('phRole'))}" value="${esc(n.role)}" oninput="updateNode(${n.id},'role',this.value)">
      <label>${esc(t('lblVolume'))}</label>
      <input type="text" placeholder="${esc(t('phVolume'))}" value="${esc(n.volume)}" oninput="updateNode(${n.id},'volume',this.value)">`;
  }
  if (n.type === 'usecase') {
    h += `<label>${esc(t('lblPattern'))}</label>
      <select class="field" onchange="updateNode(${n.id},'pattern',this.value)">
        ${PATTERNS.map(p => `<option value="${p}" ${p === (n.pattern || '') ? 'selected' : ''}>${esc(patternLabel(p))}</option>`).join('')}
      </select>
      <label>${esc(t('lblValue'))}</label>
      <select class="field" onchange="updateNode(${n.id},'value',this.value)">${scoreOpts(n.value)}</select>
      <label>${esc(t('lblEffort'))}</label>
      <select class="field" onchange="updateNode(${n.id},'effort',this.value)">${scoreOpts(n.effort)}</select>`;
  }
  h += `<div class="btn-row">
      <button class="btn btn-secondary" onclick="startLink(${n.id})">${esc(t('btnConnect'))}</button>
      <button class="btn btn-secondary" onclick="deleteSelection()">${esc(t('btnDelete'))}</button>
    </div>`;
  box.innerHTML = h;
}
function scoreOpts(v) { return [1,2,3,4,5].map(s => `<option value="${s}" ${String(s) === String(v || '3') ? 'selected' : ''}>${s}</option>`).join(''); }

function updateNode(id, field, value) {
  const n = nodeById(id);
  if (!n) return;
  n[field] = value;
  const el = nodeEls[id];
  if (el) {
    // Repaint just this block so typing never rebuilds the whole board
    // (which would blur the input on every keystroke).
    const titleEl = el.querySelector('.node-title');
    if (titleEl && field === 'title') titleEl.textContent = value;
    if (field === 'detail') {
      let d = el.querySelector('.node-detail');
      if (value && !d) { d = document.createElement('div'); d.className = 'node-detail'; el.insertBefore(d, el.querySelector('.node-meta') || el.querySelector('.node-handle')); }
      if (d) { if (value) d.textContent = value; else d.remove(); }
    }
    if (['role','volume','pattern','value','effort'].indexOf(field) !== -1) {
      const line = nodeMetaLine(n);
      let m = el.querySelector('.node-meta');
      if (line && !m) { m = document.createElement('div'); m.className = 'node-meta'; el.insertBefore(m, el.querySelector('.node-handle')); }
      if (m) { if (line) m.textContent = line; else m.remove(); }
    }
    el.setAttribute('aria-label', typeLabel(n.type) + ': ' + n.title);
  }
  renderEdges();
  renderPreview();
  save();
  syncNode(id);
}
function updateEdge(id, label) {
  const e = edgeById(id);
  if (!e) return;
  e.label = label;
  renderEdges();
  renderPreview();
  save();
  syncEdgeOp(id);
}

// ── Selection, dragging, panning, zooming ───────────────────────
function select(kind, id) { sel = kind ? { kind, id } : null; renderBoard(); }

function applyView() {
  const w = worldEl();
  w.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
  w.style.setProperty('--z', view.z);
}
function zoomAt(clientX, clientY, factor) {
  const r = viewEl().getBoundingClientRect();
  const px = clientX - r.left, py = clientY - r.top;
  const wx = (px - view.x) / view.z, wy = (py - view.y) / view.z;
  view.z = clamp(view.z * factor, 0.3, 2.2);
  view.x = px - wx * view.z;
  view.y = py - wy * view.z;
  applyView(); save();
}
function zoomStep(factor) {
  const r = viewEl().getBoundingClientRect();
  zoomAt(r.left + r.width / 2, r.top + r.height / 2, factor);
}
function boardBBox() {
  if (!nodes.length) return null;
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  nodes.forEach(n => {
    const r = nodeRect(n.id);
    if (!r) return;
    x0 = Math.min(x0, r.x); y0 = Math.min(y0, r.y);
    x1 = Math.max(x1, r.x + r.w); y1 = Math.max(y1, r.y + r.h);
  });
  if (x0 === Infinity) return null;
  return { x: x0, y: y0, w: Math.max(1, x1 - x0), h: Math.max(1, y1 - y0) };
}
function fitBoard() {
  const bb = boardBBox();
  const r = viewEl().getBoundingClientRect();
  if (!bb) { view = { x: 40, y: 40, z: 1 }; applyView(); save(); return; }
  const pad = 44;
  view.z = clamp(Math.min((r.width - pad * 2) / bb.w, (r.height - pad * 2) / bb.h), 0.3, 1.4);
  view.x = (r.width - bb.w * view.z) / 2 - bb.x * view.z;
  view.y = (r.height - bb.h * view.z) / 2 - bb.y * view.z;
  applyView(); save();
}

function startLink(fromId) {
  linkFrom = fromId;
  viewEl().classList.add('linking');
  showStatus(t('connectHint'));
  renderBoard();
}
function cancelLink() {
  linkFrom = null;
  viewEl().classList.remove('linking');
  hideStatus();
  renderBoard();
}
function completeLink(toId) {
  if (linkFrom === null || toId === linkFrom) return cancelLink();
  const dup = edges.some(e => (e.from === linkFrom && e.to === toId) || (e.from === toId && e.to === linkFrom));
  let madeEdge = null;
  if (!dup) {
    pushUndo();
    madeEdge = { id: nextId++, from: linkFrom, to: toId, label: '' };
    edges.push(madeEdge);
  }
  linkFrom = null;
  viewEl().classList.remove('linking');
  hideStatus();
  sel = { kind: 'node', id: toId };
  renderBoard(); renderPreview(); save();
  if (madeEdge) syncEdgeOp(madeEdge.id);
}
function showStatus(msg) {
  const s = document.getElementById('boardStatus');
  s.textContent = msg; s.style.display = 'block';
  document.getElementById('srStatus').textContent = msg;
}
function hideStatus() {
  document.getElementById('boardStatus').style.display = 'none';
  document.getElementById('srStatus').textContent = '';
}

(function wireBoardPointer() {
  const vw = viewEl();
  let mode = null;           // 'drag' | 'pan' | 'link'
  let dragId = null, dragDX = 0, dragDY = 0, panSX = 0, panSY = 0, panVX = 0, panVY = 0;
  let moved = false, rubber = null;

  function toWorld(clientX, clientY) {
    const r = vw.getBoundingClientRect();
    return { x: (clientX - r.left - view.x) / view.z, y: (clientY - r.top - view.y) / view.z };
  }

  vw.addEventListener('pointerdown', ev => {
    // The inspector sits inside the viewport so it survives focus mode.
    // Without this, panning would capture the pointer and the click would
    // retarget to the canvas — leaving its inputs and buttons dead.
    if (ev.target.closest('.inspector')) return;
    const handle = ev.target.closest('.node-handle');
    const nodeEl = ev.target.closest('.node');
    const edgeEl = ev.target.closest('.edge-hit');
    moved = false;

    if (handle) {
      ev.preventDefault();
      mode = 'link'; SY.busy = true;
      linkFrom = Number(handle.getAttribute('data-handle'));
      vw.classList.add('linking');
      rubber = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      rubber.setAttribute('class', 'edge-line soft');
      document.getElementById('edgeLayer').appendChild(rubber);
      vw.setPointerCapture(ev.pointerId);
      return;
    }
    if (nodeEl) {
      const id = Number(nodeEl.getAttribute('data-id'));
      if (linkFrom !== null) { completeLink(id); return; }
      ev.preventDefault();
      pushUndo();
      mode = 'drag'; dragId = id; SY.busy = true;
      const w = toWorld(ev.clientX, ev.clientY);
      const p = layout[id];
      dragDX = w.x - p.x; dragDY = w.y - p.y;
      select('node', id);
      vw.setPointerCapture(ev.pointerId);
      return;
    }
    if (edgeEl) {
      select('edge', Number(edgeEl.getAttribute('data-edge')));
      return;
    }
    if (linkFrom !== null) { cancelLink(); return; }
    mode = 'pan';
    panSX = ev.clientX; panSY = ev.clientY; panVX = view.x; panVY = view.y;
    vw.classList.add('panning');
    vw.setPointerCapture(ev.pointerId);
  });

  vw.addEventListener('pointermove', ev => {
    if (!mode) return;
    moved = true;
    if (mode === 'drag') {
      const w = toWorld(ev.clientX, ev.clientY);
      const p = layout[dragId];
      p.x = Math.round(clamp(w.x - dragDX, 0, 3900));
      p.y = Math.round(clamp(w.y - dragDY, 0, 2900));
      const el = nodeEls[dragId];
      if (el) { el.style.left = p.x + 'px'; el.style.top = p.y + 'px'; }
      renderEdges();
    } else if (mode === 'pan') {
      view.x = panVX + (ev.clientX - panSX);
      view.y = panVY + (ev.clientY - panSY);
      applyView();
    } else if (mode === 'link' && rubber) {
      const r0 = nodeRect(linkFrom);
      const w = toWorld(ev.clientX, ev.clientY);
      if (r0) {
        const p1 = borderPoint(r0, w.x, w.y);
        rubber.setAttribute('d', `M${p1.x},${p1.y} L${w.x},${w.y}`);
      }
    }
  });

  function endPointer(ev) {
    if (!mode) return;
    if (mode === 'drag') {
      if (!moved) undoStack.pop();   // a click, not a move: nothing to undo
      save();
      if (moved) syncNode(dragId);
    } else if (mode === 'pan') {
      vw.classList.remove('panning');
      if (!moved) select(null);
      save();
    } else if (mode === 'link') {
      if (rubber) { rubber.remove(); rubber = null; }
      const el = document.elementFromPoint(ev.clientX, ev.clientY);
      const target = el && el.closest ? el.closest('.node') : null;
      if (target) completeLink(Number(target.getAttribute('data-id')));
      else cancelLink();
    }
    mode = null; dragId = null;
    SY.busy = false;
    syncCatchUp();
    syncUndoButtons();
  }
  vw.addEventListener('pointerup', endPointer);
  vw.addEventListener('pointercancel', endPointer);

  // Plain wheel is left to the page so the board never traps a scroll;
  // in focus mode there is no page behind it, so it zooms directly.
  vw.addEventListener('wheel', ev => {
    if (ev.target.closest('.inspector')) return;
    const focus = document.getElementById('boardShell').classList.contains('focus');
    if (!(ev.ctrlKey || ev.metaKey || focus)) return;
    ev.preventDefault();
    zoomAt(ev.clientX, ev.clientY, ev.deltaY < 0 ? 1.1 : 1 / 1.1);
  }, { passive: false });

  vw.addEventListener('dblclick', ev => {
    const nodeEl = ev.target.closest('.node');
    if (!nodeEl) return;
    select('node', Number(nodeEl.getAttribute('data-id')));
    const tf = document.getElementById('insTitle');
    if (tf) { tf.focus(); tf.select(); }
  });
})();

document.addEventListener('keydown', ev => {
  const tag = (ev.target.tagName || '').toLowerCase();
  const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
  if (ev.key === 'Escape') {
    if (linkFrom !== null) { cancelLink(); return; }
    if (!document.fullscreenElement && document.getElementById('boardShell').classList.contains('focus')) { toggleFocus(); return; }
  }
  if (typing) return;
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') {
    ev.preventDefault();
    ev.shiftKey ? redo() : undo();
    return;
  }
  if (!sel) return;
  if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); deleteSelection(); return; }
  if (sel.kind === 'node' && ev.key.indexOf('Arrow') === 0) {
    const p = layout[sel.id];
    if (!p) return;
    ev.preventDefault();
    const d = ev.shiftKey ? 20 : 10;
    if (ev.key === 'ArrowLeft') p.x = clamp(p.x - d, 0, 3900);
    if (ev.key === 'ArrowRight') p.x = clamp(p.x + d, 0, 3900);
    if (ev.key === 'ArrowUp') p.y = clamp(p.y - d, 0, 2900);
    if (ev.key === 'ArrowDown') p.y = clamp(p.y + d, 0, 2900);
    const el = nodeEls[sel.id];
    if (el) { el.style.left = p.x + 'px'; el.style.top = p.y + 'px'; }
    renderEdges(); save();
    syncNode(sel.id);
  }
});

// Full screen: ask the browser for real fullscreen so the chrome goes away
// when the board is on a meeting-room projector, and fall back to a fixed
// full-viewport overlay where that is refused or unsupported.
function setFocus(on) {
  const shell = document.getElementById('boardShell');
  shell.classList.toggle('focus', on);
  document.body.classList.toggle('focus-on', on);
  const btn = document.getElementById('btnFocus');
  if (btn) btn.textContent = on ? t('btnExitFocus') : t('btnFocus');
  setTimeout(() => { renderEdges(); }, 30);
}
function toggleFocus() {
  const shell = document.getElementById('boardShell');
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  if (shell.classList.contains('focus')) { setFocus(false); return; }
  if (shell.requestFullscreen) {
    // The class still goes on: it is what grows the canvas to fill the frame.
    shell.requestFullscreen().then(() => setFocus(true)).catch(() => setFocus(true));
  } else {
    setFocus(true);
  }
}
// Esc and the browser's own exit both come back through here, so the button
// label can never disagree with what the board is actually doing.
document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) setFocus(false);
});

// ── The deliverable: reading the board back ─────────────────────
function nodesOf(type) { return nodes.filter(n => n.type === type); }
function neighbours(id) {
  const out = [];
  edges.forEach(e => {
    if (e.from === id) out.push(nodeById(e.to));
    else if (e.to === id) out.push(nodeById(e.from));
  });
  return out.filter(Boolean);
}
function neighboursOfType(id, type) { return neighbours(id).filter(n => n.type === type); }
function nodeLabel(n) { return (n.title || '').trim() || typeLabel(n.type); }

// Walk the step graph so the document reads in the order the work
// actually happens, not the order blocks were dropped on the canvas.
function orderedSteps() {
  const steps = nodesOf('step');
  if (!steps.length) return [];
  const ids = new Set(steps.map(s => s.id));
  const flow = edges.filter(e => ids.has(e.from) && ids.has(e.to));
  const incoming = {}, outgoing = {};
  steps.forEach(s => { incoming[s.id] = []; outgoing[s.id] = []; });
  flow.forEach(e => { outgoing[e.from].push(e.to); incoming[e.to].push(e.from); });
  const byX = (a, b) => (layout[a] ? layout[a].x : 0) - (layout[b] ? layout[b].x : 0);
  const roots = steps.filter(s => !incoming[s.id].length).map(s => s.id).sort(byX);
  const seen = new Set(), order = [];
  const walk = id => {
    if (seen.has(id)) return;
    seen.add(id); order.push(id);
    outgoing[id].slice().sort(byX).forEach(walk);
  };
  roots.forEach(walk);
  // A cycle or an island leaves steps unvisited; append them left-to-right
  // rather than dropping them from the deliverable.
  steps.map(s => s.id).sort(byX).forEach(id => { if (!seen.has(id)) walk(id); });
  return order.map(id => nodeById(id)).filter(Boolean);
}

function quickTake(n) {
  const v = Number(n.value || 3), e = Number(n.effort || 3);
  if (v >= 4 && e <= 3) return t('takeQuick');
  if (v >= 4) return t('takeStrategic');
  if (e <= 3) return t('takeFill');
  return t('takeQuestion');
}
function attachedTo(n) {
  const rel = neighbours(n.id).filter(x => x.type === 'step' || x.type === 'pain');
  return rel.length ? rel.map(nodeLabel).join(', ') : t('unattached');
}

function renderPreview() {
  const draft = val('draftDoc');

  if (draft && draft.trim()) { el.innerHTML = mdToHtml(draft); return; }

  const date = new Date().toISOString().slice(0, 10);

  let h = `<div class="meta"><strong>${esc(t('docFor'))}:</strong> ${esc(val('client')) || '—'} &nbsp;·&nbsp; <strong>${esc(t('docAssessor'))}:</strong> ${esc(val('assessor')) || '—'} &nbsp;·&nbsp; <strong>${esc(t('docDate'))}:</strong> ${date}</div>`;
  if (val('process')) h += `<p><strong>${esc(t('docProcess'))}:</strong> ${esc(val('process'))}</p>`;

  h += `<h3>${esc(t('secWorkflow'))}</h3>`;
  if (steps.length) {

      if (s.detail) h += `<br>${esc(s.detail)}`;
      if (pains.length) h += `<br><em>${esc(t('colPain'))}:</em> ${esc(pains.join(', '))}`;
      if (sys.length) h += `<br><em>${esc(t('colSystem'))}:</em> ${esc(sys.join(', '))}`;
      if (ucs.length) h += `<br><em>${esc(t('colUseCase'))}:</em> ${esc(ucs.join(', '))}`;
      h += '</li>';
    });
    h += '</ol>';
  } else { h += `<p><em>${esc(t('emptyWorkflow'))}</em></p>`; }

  const pains = nodesOf('pain');
  h += `<h3>${esc(t('secFriction'))}</h3>`;
  if (pains.length) {
    h += `<table><thead><tr><th>${esc(t('colPain'))}</th><th>${esc(t('colWhere'))}</th><th>${esc(t('lblNodeDetail'))}</th></tr></thead><tbody>`;
    h += pains.map(p => {

      return `<tr><td>${esc(nodeLabel(p))}</td><td>${esc(where)}</td><td>${esc(p.detail)}</td></tr>`;
    }).join('');

  const sys = nodesOf('system');

    h += `<table><thead><tr><th>${esc(t('colSystem'))}</th><th>${esc(t('colTouchedAt'))}</th><th>${esc(t('lblNodeDetail'))}</th></tr></thead><tbody>`;
    h += sys.map(s => {
      const where = neighboursOfType(s.id, 'step').map(nodeLabel).join(', ') || t('unattached');
      return `<tr><td>${esc(nodeLabel(s))}</td><td>${esc(where)}</td><td>${esc(s.detail)}</td></tr>`;
    }).join('');
    h += '</tbody></table>';
  } else { h += `<p><em>${esc(t('emptySystems'))}</em></p>`; }

  const ucs = nodesOf('usecase');
  h += `<h3>${esc(t('secCandidates'))}</h3>`;
  if (ucs.length) {
    h += `<table><thead><tr><th>${esc(t('colUseCase'))}</th><th>${esc(t('colPattern'))}</th><th>${esc(t('colAttaches'))}</th><th>${esc(t('colValue'))}</th><th>${esc(t('colEffort'))}</th><th>${esc(t('colRead'))}</th></tr></thead><tbody>`;
    h += ucs.map(u => `<tr><td><strong>${esc(nodeLabel(u))}</strong>${u.detail ? '<br>' + esc(u.detail) : ''}</td><td>${esc(u.pattern ? patternLabel(u.pattern) : '—')}</td><td>${esc(attachedTo(u))}</td><td>${esc(u.value || '3')}</td><td>${esc(u.effort || '3')}</td><td>${esc(quickTake(u))}</td></tr>`).join('');
    h += '</tbody></table>';
    h += `<p style="color:var(--muted);font-size:13px">${esc(t('handoffNote'))}</p>`;
  } else { h += `<p><em>${esc(t('emptyCandidates'))}</em></p>`; }

  const notes = nodesOf('note').filter(n => nodeLabel(n) || n.detail);
  if (notes.length) {

    h += notes.map(n => `<li>${esc(nodeLabel(n))}${n.detail ? ' — ' + esc(n.detail) : ''}</li>`).join('');
    h += '</ul>';
  }
  el.innerHTML = h;
}

// ── Board as SVG ────────────────────────────────────────────────

const SVG_FILL = { step: '#ffffff', pain: '#fff3f0', system: '#f1f4fb', usecase: '#EEEEFA', note: '#fffbe8' };
const SVG_STROKE = { step: '#1B1474', pain: '#c0392b', system: '#4a5c8a', usecase: '#5348c4', note: '#d4790e' };
function wrapWords(text, maxChars) {
  const words = String(text || '').split(/\s+/).filter(Boolean);

  let line = '';
  words.forEach(w => {
    if (!line) { line = w; return; }
    if ((line + ' ' + w).length <= maxChars) line += ' ' + w;
    else { lines.push(line); line = w; }
  });

}
function exportBoardSvg() {
  const bb = boardBBox();

    ty += 15;

      body += `<text x="${r.x + 11}" y="${ty}" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#1c1c28">${esc(l)}</text>`;
      ty += 16;
    });
    if (n.detail) wrapWords(n.detail, Math.floor((r.w - 22) / 5.9)).forEach(l => {
      body += `<text x="${r.x + 11}" y="${ty}" font-family="Inter, sans-serif" font-size="11.5" fill="#5b5b6b">${esc(l)}</text>`;
      ty += 14;
    });

<marker id="ahS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,5 L0,10 z" fill="#5348c4"/></marker>

// ── Markdown rendering for a pasted agent draft ──────────────────
function _mdInline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`(.+?)`/g, '<code>$1</code>'); }
function _mdRow(line) { return line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim()); }
function mdToHtml(md) {
  if (!md || !md.trim()) return '';
  const L = md.replace(/\r/g, '').split('\n');
  let html = '', i = 0;
  while (i < L.length) {
    const line = L[i];
    if (/^\s*$/.test(line)) { i++; continue; }
    if (/^```/.test(line.trim())) {
      i++; const buf = [];
      while (i < L.length && !/^```/.test(L[i].trim())) { buf.push(L[i]); i++; }
      i++;
      html += '<pre>' + esc(buf.join('\n')) + '</pre>';
      continue;
    }
    if (line.includes('|') && i + 1 < L.length && /-/.test(L[i + 1]) && /^[\s:|-]+$/.test(L[i + 1].trim())) {
      const head = _mdRow(line); i += 2; const body = [];
      while (i < L.length && L[i].includes('|') && L[i].trim() !== '') { body.push(_mdRow(L[i])); i++; }
      html += '<table><thead><tr>' + head.map(h => '<th>' + _mdInline(h) + '</th>').join('') + '</tr></thead><tbody>'
            + body.map(r => '<tr>' + r.map(c => '<td>' + _mdInline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
      continue;
    }
    let m;
    if (m = line.match(/^(#{1,4})\s+(.*)/)) { const lv = m[1].length + 1; html += '<h' + lv + '>' + _mdInline(m[2]) + '</h' + lv + '>'; i++; continue; }
    if (/^\s*[-*]\s+/.test(line)) { const it = []; while (i < L.length && /^\s*[-*]\s+/.test(L[i])) { it.push(L[i].replace(/^\s*[-*]\s+/, '')); i++; } html += '<ul>' + it.map(x => '<li>' + _mdInline(x) + '</li>').join('') + '</ul>'; continue; }
    if (/^\s*\d+\.\s+/.test(line)) { const it = []; while (i < L.length && /^\s*\d+\.\s+/.test(L[i])) { it.push(L[i].replace(/^\s*\d+\.\s+/, '')); i++; } html += '<ol>' + it.map(x => '<li>' + _mdInline(x) + '</li>').join('') + '</ol>'; continue; }
    const para = [line]; i++;
    while (i < L.length && !/^\s*$/.test(L[i]) && !/^(#{1,4}\s|[-*]\s|\d+\.\s)/.test(L[i]) && !L[i].includes('|')) { para.push(L[i]); i++; }
    html += '<p>' + _mdInline(para.join(' ')) + '</p>';
  }
  return html;
}

// ── Agent drafting prompt ───────────────────────────────────────
function _humanizeKey(k) { return String(k).replace(/_/g, ' ').replace(/([a-z0-9])([A-Z])/g, '$1 $2').replace(/\b[a-z]/g, c => c.toUpperCase()).trim(); }
function buildDraftPrompt() {
  let p = 'You are an expert AI-architecture consultant. Draft the complete "' + STRINGS.en.docTitle + '" deliverable for the engagement below as clean, client-ready Markdown.\n\n';
  p += "Methodology to follow (this tool's SOP):\n";
  STRINGS.en.sop.forEach((s, i) => { p += (i + 1) + '. ' + s + '\n'; });
  p += "\nConsultant intake (verbatim — build on it, don't merely restate it):\n";
  document.querySelectorAll('[data-eng]').forEach(el => {
    const k = el.getAttribute('data-eng');
    if (k === 'draftDoc') return;
    if (el.value && el.value.trim()) p += '- ' + _humanizeKey(k) + ': ' + el.value + '\n';
  });
  // The board itself: blocks with their types, and the connections that
  // give them meaning. Sent as JSON so the agent reads the same graph
  // the document is generated from.
  if (nodes.length) {
    const blocks = nodes.map(n => {
      const o = { type: n.type, label: n.title };
      if (n.detail) o.detail = n.detail;
      if (n.type === 'step') { if (n.role) o.performedBy = n.role; if (n.volume) o.volume = n.volume; }
      if (n.type === 'usecase') { o.pattern = n.pattern ? STRINGS.en['pat_' + n.pattern] : 'not set'; o.value = n.value; o.effort = n.effort; }
      return o;
    });
    p += '\nWorkshop board — blocks (JSON):\n' + JSON.stringify(blocks, null, 2) + '\n';
    if (edges.length) {
      const links = edges.map(e => {
        const a = nodeById(e.from), b = nodeById(e.to);
        if (!a || !b) return null;
        return { from: a.title, to: b.title, kind: (a.type === 'step' && b.type === 'step') ? 'flow' : 'attachment', label: e.label || undefined };
      }).filter(Boolean);
      p += '\nWorkshop board — connections (JSON):\n' + JSON.stringify(links, null, 2) + '\n';
    }
    const walk = orderedSteps().map((s, i) => (i + 1) + '. ' + (s.title || ''));
    if (walk.length) p += '\nThe workflow in order, as the board connects it:\n' + walk.join('\n') + '\n';
  }
  p += '\nRequirements: professional consulting tone; walk the workflow step by step in the order given; expand thin inputs into complete, specific sections; keep every candidate use case tied to the step or pain point it attaches to; never invent client facts — where information is missing, add it to a final "Open questions for the client" section; structure with clear Markdown headings; output only the document.';
  return p;
}

// ── Live session ────────────────────────────────────────────────
// Opt-in multi-user editing against a relay the facilitator runs on their own
// laptop (workshop-relay.py, next to this file). Until someone presses "Go
// live" this block makes no network call whatsoever, so the board served from
// the public site stays exactly as local as every other tool in the toolkit.
//
// Conflict model is last-writer-wins per block, which is what a room of people
// drawing on one canvas actually expects: two people editing different blocks
// never collide, and two people dragging the same block is a social problem,
// not a technical one. Node ids are minted from a per-peer range the relay
// hands out, so simultaneous additions can never collide on an id.
const SY = {
  on: false, peerId: null, session: 'default', seq: 0,
  peers: [], queue: [], flushTimer: null, poll: null,
  busy: false, dirty: false, errs: 0,
};

function syncPost(path, body, extra) {
  return fetch(path, Object.assign({
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  }, extra || {}));
}
function setSyncStatus(msg) {
  const el = document.getElementById('syncStatus');
  if (el) el.textContent = msg || '';
}
function syncBtnLabel() {
  const b = document.getElementById('syncBtn');
  if (b) b.textContent = SY.on ? t('btnLeaveLive') : t('btnGoLive');
}
function renderPeers() {
  const box = document.getElementById('syncPeers');
  const strip = document.getElementById('peerStrip');
  const list = SY.on ? SY.peers : [];
  if (box) box.innerHTML = list.map(p =>
    `<span class="peer${p.id === SY.peerId ? ' me' : ''}"><span class="dot" style="background:${esc(p.colour)}"></span>${esc(p.name)}${p.id === SY.peerId ? ' · ' + esc(t('peerYou')) : ''}</span>`).join('');
  if (strip) strip.innerHTML = list.map(p =>
    `<span class="pip" style="background:${esc(p.colour)}" title="${esc(p.name)}"></span>`).join('');
}

// ── outbound ────────────────────────────────────────────────────
function syncEmit(op) {
  if (!SY.on) return;
  SY.queue.push(op);
  if (SY.flushTimer) return;
  // Coalesced on a short timer so holding a key down is one request, not thirty.
  SY.flushTimer = setTimeout(() => { SY.flushTimer = null; flushSync(); }, 120);
}
function syncNode(id) { if (SY.on) { const n = nodeById(id); if (n) syncEmit({ t: 'node', node: n, layout: layout[id] }); } }
function syncNodeDel(id) { if (SY.on) syncEmit({ t: 'nodeDel', id }); }
function syncEdgeOp(id) { if (SY.on) { const e = edgeById(id); if (e) syncEmit({ t: 'edge', edge: e }); } }
function syncEdgeDel(id) { if (SY.on) syncEmit({ t: 'edgeDel', id }); }
function syncDoc() { if (SY.on) syncEmit({ t: 'doc', doc: { fields: collectFields(), nodes, layout, edges } }); }

function flushSync(keepalive) {
  if (!SY.on || !SY.queue.length) return;
  let q = SY.queue;
  SY.queue = [];
  // A whole-document op makes everything queued before it redundant.
  let lastDoc = -1;
  q.forEach((o, i) => { if (o.t === 'doc') lastDoc = i; });
  if (lastDoc >= 0) q = q.slice(lastDoc);
  // Keep only the newest op per block, preserving order otherwise.
  const seen = {}, out = [];
  for (let i = q.length - 1; i >= 0; i--) {
    const o = q[i];
    const k = o.t === 'node' ? 'n' + o.node.id : (o.t === 'edge' ? 'e' + o.edge.id : null);
    if (k) { if (seen[k]) continue; seen[k] = 1; }
    out.unshift(o);
  }
  syncPost('/sync/ops', { session: SY.session, peerId: SY.peerId, ops: out },
           keepalive ? { keepalive: true } : null).catch(() => {});
}

// ── inbound ─────────────────────────────────────────────────────
function applyRemoteOp(op) {
  if (op.t === 'doc') {
    const d = op.doc || {};
    nodes = Array.isArray(d.nodes) ? d.nodes : [];
    layout = d.layout && typeof d.layout === 'object' ? d.layout : {};
    edges = Array.isArray(d.edges) ? d.edges : [];
    if (d.fields) {
      // Never yank a field out from under someone who is typing in it.
      Object.keys(d.fields).forEach(k => {
        const el = document.querySelector('[data-eng="' + k + '"]');
        if (el && document.activeElement !== el) el.value = d.fields[k];
      });
    }
    if (sel && !(sel.kind === 'node' ? nodeById(sel.id) : edgeById(sel.id))) sel = null;
  } else if (op.t === 'node' && op.node) {
    // A block someone else moved while we are dragging our own is fine; a
    // remote write to the block *we* are dragging would fight the pointer.
    if (SY.busy && sel && sel.kind === 'node' && sel.id === op.node.id) return;
    const i = nodes.findIndex(n => n.id === op.node.id);
    if (i >= 0) nodes[i] = op.node; else nodes.push(op.node);
    if (op.layout) layout[op.node.id] = op.layout;
  } else if (op.t === 'nodeDel') {
    nodes = nodes.filter(n => n.id !== op.id);
    delete layout[op.id];
    edges = edges.filter(e => e.from !== op.id && e.to !== op.id);
    if (sel && sel.kind === 'node' && sel.id === op.id) sel = null;
  } else if (op.t === 'edge' && op.edge) {
    const i = edges.findIndex(e => e.id === op.edge.id);
    if (i >= 0) edges[i] = op.edge; else edges.push(op.edge);
  } else if (op.t === 'edgeDel') {
    edges = edges.filter(e => e.id !== op.id);
    if (sel && sel.kind === 'edge' && sel.id === op.id) sel = null;
  } else if (op.t === 'field') {
    const el = document.querySelector('[data-eng="' + op.k + '"]');
    if (el && document.activeElement !== el) el.value = op.v;
  }
}
function remoteRender() {
  // Mid-drag the DOM must not be rebuilt under the pointer; catch up after.
  if (SY.busy) { SY.dirty = true; return; }
  const ae = document.activeElement;
  const keep = !!(ae && ae.closest && ae.closest('.inspector'));
  renderBoard({ keepInspector: keep });
  renderPreview();
  save();
}
function syncCatchUp() { if (SY.dirty) { SY.dirty = false; remoteRender(); } }

async function pollLoop() {
  while (SY.on) {
    try {
      const url = '/sync/poll?session=' + encodeURIComponent(SY.session) +
                  '&peerId=' + encodeURIComponent(SY.peerId) + '&since=' + SY.seq;
      const r = await fetch(url);
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const d = await r.json();
      if (!SY.on) return;
      let changed = false;
      if (d.resync) { applyRemoteOp({ t: 'doc', doc: d.doc }); changed = true; }
      else if (d.ops && d.ops.length) { d.ops.forEach(o => applyRemoteOp(o.op)); changed = true; }
      if (typeof d.seq === 'number') SY.seq = d.seq;
      const rosterChanged = JSON.stringify(d.peers || []) !== JSON.stringify(SY.peers);
      SY.peers = d.peers || [];
      if (rosterChanged) { renderPeers(); setSyncStatus(t('syncLive')(SY.peers.length)); }
      if (changed) remoteRender();
      SY.errs = 0;
    } catch (e) {
      if (!SY.on) return;
      SY.errs++;
      setSyncStatus(t('syncLost'));
      await new Promise(res => setTimeout(res, Math.min(8000, 400 * SY.errs)));
    }
  }
}

// ── connect / disconnect ────────────────────────────────────────
async function toggleSync() {
  if (SY.on) return leaveSync();
  const session = ((document.getElementById('syncSession') || {}).value || 'default').trim() || 'default';
  const name = ((document.getElementById('syncName') || {}).value || '').trim();
  setSyncStatus(t('syncConnecting'));
  try {
    // Look before joining, so a board about to be replaced can be defended.
    const pre = await fetch('/sync/state?session=' + encodeURIComponent(session));
    if (!pre.ok) throw new Error('HTTP ' + pre.status);
    const state = await pre.json();
    if (state.seeded && nodes.length && !confirm(t('syncReplaceConfirm'))) {
      setSyncStatus(t('syncOffline'));
      return;
    }
    const r = await syncPost('/sync/join', {
      session, name, doc: { fields: collectFields(), nodes, layout, edges },
    });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    SY.on = true; SY.peerId = d.peerId; SY.session = session;
    SY.seq = d.seq; SY.peers = d.peers || []; SY.errs = 0;
    // Mint new blocks from this peer's own id range.
    nextId = Math.max(nextId, d.idBase);
    // Adopting replaces the board, so whatever was selected is gone. Seeding
    // keeps your own board, so keep your place in it too.
    if (d.adopted) { applyRemoteOp({ t: 'doc', doc: d.doc }); sel = null; }
    renderBoard(); renderPreview(); renderPeers(); save();
    syncBtnLabel();
    syncInviteVisibility();
    setSyncStatus(d.adopted ? t('syncAdopted') : t('syncSeeded'));
    pollLoop();
  } catch (e) {
    SY.on = false;
    syncBtnLabel();
    setSyncStatus(t('syncNoRelay'));
  }
}
function joinFromInvite() {
  const from = document.getElementById('inviteName');
  const to = document.getElementById('syncName');
  if (from && to && from.value.trim()) to.value = from.value.trim();
  toggleSync();
}
function syncInviteVisibility() {
  const invite = document.getElementById('liveInvite');
  if (invite && SY.on) invite.hidden = true;
}
function leaveSync() {
  const session = SY.session, peerId = SY.peerId;
  SY.on = false; SY.peers = []; SY.queue = [];
  if (SY.flushTimer) { clearTimeout(SY.flushTimer); SY.flushTimer = null; }
  if (peerId) syncPost('/sync/leave', { session, peerId }, { keepalive: true }).catch(() => {});
  SY.peerId = null;
  renderPeers(); syncBtnLabel(); setSyncStatus(t('syncOffline'));
}
window.addEventListener('beforeunload', () => {
  if (!SY.on) return;
  flushSync(true);
  syncPost('/sync/leave', { session: SY.session, peerId: SY.peerId }, { keepalive: true }).catch(() => {});
});

// ── Init ────────────────────────────────────────────────────────
(function init() {
  document.getElementById('langSelect').value = lang;
  loadSaved();
  prefillEngagement();
  applyI18n();
  renderBoard();
  renderPreview();
  // Heights are only known once the blocks are laid out, so the first
  // fit has to wait a frame or every edge anchors to a guessed box.
  const qs = new URLSearchParams(location.search);
  const sessEl = document.getElementById('syncSession');
  if (sessEl) sessEl.value = qs.get('session') || 'default';
  // The relay's shared link always carries ?session=; the public site's never
  // does. Keying the banner off that means arriving here normally still costs
  // no network call at all — we never probe to find out whether a relay exists.
  const invite = document.getElementById('liveInvite');
  if (invite && qs.has('session')) invite.hidden = false;
  syncBtnLabel();
  setSyncStatus(t('syncOffline'));
  renderPeers();
  requestAnimationFrame(() => { renderEdges(); if (nodes.length) fitBoard(); });
  window.addEventListener('resize', () => { renderEdges(); });
})();
</script>
